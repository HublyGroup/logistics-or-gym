[project]
name = "logistics-or-gym"
version = "0.11.0"
description = "or-problems formulated as gym environments to solve logisitcal-problems"
license = "MIT"
readme = "README.md"
authors = [
    { name = "hadisdev", email = "hadi.salameh@hotmail.com" },
]
keywords = ["logistics-or-gym", "or", "gym", "logistics", "logistics-or", "or-gym"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: OS Independent",
]

requires-python = ">=3.14"
dependencies = [
    "gymnasium>=1.0.0,<2",
    "numpy>=2.4.4",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.10"]
train = [
    "stable-baselines3>=2.5",
    "sb3-contrib>=2.5",
    "tensorboard>=2.20.0",
]
rl4co = ["rl4co>=0.6", "tensorboard>=2.20.0"]

[project.urls]
Homepage = "https://github.com/HublyGroup/logistics-or-gym"
Repository = "https://github.com/HublyGroup/logistics-or-gym"

[dependency-groups]
dev = [
    "matplotlib>=3.10",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
train = [
    "stable-baselines3>=2.5",
    "sb3-contrib>=2.5",
    "tensorboard>=2.20.0",
]
rl4co = ["rl4co>=0.6", "tensorboard>=2.20.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["logistics_or_gym"]

[tool.hatch.build.targets.sdist]
exclude = [
    "research",
    "main.py",
    "uv.lock",
    ".github",
    ".python-version",
    "dist",
]
